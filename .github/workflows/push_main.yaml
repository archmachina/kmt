---

name: push_main
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  push_main:
    name: "push_main"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: python setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: push_main
        shell: bash
        run: |
          ./entrypoint push_main
        env:
          REGISTRY_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
